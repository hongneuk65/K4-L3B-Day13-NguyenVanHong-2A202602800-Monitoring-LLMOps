service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  error_budget_requests_per_10000: 50
  baseline_observation: 'CP1 sample: 26 responses, latency P95 1357 ms, 0 request errors and retrieval success 100%; the 3000 ms target remains above the observed tail latency.'
  note: 'SLO 99.5% means an error budget of 0.5%. For every 10,000 requests, at most 50 may fail the successful-and-fast condition.'
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
